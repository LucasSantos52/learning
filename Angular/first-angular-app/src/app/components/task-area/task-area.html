<section id="tasks">
    <header>
        <h2>{{user?.name}}'s Tasks</h2>
        <menu>
            <button>Add Task</button>
        </menu>
    </header>

    <ul>
        @for(task of selectedUserTasks; track task.id){
            <li>
                <app-task-item [task]="task" (complete)="onCompleteTask($event)" />
            </li>
        }
    </ul>
</section>

<app-new-task [visible]="true" (addNew)="addNewTask($event)" />
