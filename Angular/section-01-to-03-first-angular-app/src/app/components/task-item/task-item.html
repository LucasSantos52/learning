<app-card>
    <article>
        <h2>{{task.title}}</h2>
        <time>{{task.dueDate | date:'shortDate'}}</time>
        <p>{{task.summary}}</p>
        <p class="actions">
            <button
                appButton
                (click)="onCompleteTask()"
            >
                Complete
            </button>
        </p>
    </article>
</app-card>
